[project]
name = "ai-newsdesk"
version = "0.1.0"
description = "Self-hosted, high-signal AI news feed with a daily briefing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.13.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    # python:3.13-slim-trixie ships no system zoneinfo; Europe/London must resolve
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-newsdesk = "ai_newsdesk.cli:run"

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.4"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "pyright>=1.1.414",
    "pre-commit>=4.6.2",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
faulthandler_timeout = "300"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: makes real network calls (run with -m integration)"]
addopts = ["-m", "not integration", "--strict-markers", "-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds plan/ADR markdown with illustrative snippets, not project source
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
